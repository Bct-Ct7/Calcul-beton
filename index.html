<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Béton PRO V3</title>

<style>
body {
  font-family: Arial;
  padding: 15px;
  max-width: 500px;
  margin: auto;
  background: #f7f7f7;
}

h2 { text-align:center; }

input, select, button {
  width: 100%;
  padding: 14px;
  margin: 6px 0;
  font-size: 16px;
}

button {
  background: #1e90ff;
  color: white;
  border: none;
  font-weight: bold;
}

.result {
  background: white;
  padding: 15px;
  margin-top: 10px;
  border-radius: 10px;
}

.big {
  font-size: 18px;
  font-weight: bold;
  margin-top:10px;
}
</style>
</head>

<body>

<h2>🧱 Béton PRO V3</h2>

<label>Surface (m²)</label>
<input type="number" id="surface">

<label>Épaisseur (cm)</label>
<input type="number" id="epaisseur">

<label>Type de dalle</label>
<select id="dosage">
<option value="250">Léger (250 kg/m³)</option>
<option value="300">Terrasse (300 kg/m³)</option>
<option value="350">Voiture (350 kg/m³)</option>
</select>

<label>Capacité bétonnière (L)</label>
<input type="number" id="betonniere" placeholder="ex: 160">

<button onclick="calculer()">CALCULER</button>

<div class="result" id="resultat"></div>

<script>
function calculer() {

let surface = parseFloat(document.getElementById("surface").value);
let epaisseur = parseFloat(document.getElementById("epaisseur").value)/100;
let dosage = parseFloat(document.getElementById("dosage").value);
let betonniere = parseFloat(document.getElementById("betonniere").value)/1000;

let volume = surface * epaisseur;

// TOTAL
let cimentTotal = volume * dosage;
let sacsTotal = cimentTotal / 35;
let sableTotal = volume * 0.5;
let gravierTotal = volume * 0.8;

// TOURNÉES
let tournees = betonniere ? volume / betonniere : 0;

// PAR TOURNÉE (répartition simple)
let sacsParTournee = sacsTotal / tournees;
let sableParTournee = sableTotal / tournees;
let gravierParTournee = gravierTotal / tournees;

// CONVERSION SEAUX (approx 10L/seau)
let cimentSeaux = sacsParTournee * 1;
let sableSeaux = sableParTournee * 1000 / 10;
let gravierSeaux = gravierParTournee * 1000 / 10;

// EAU (approx)
let eau = sacsParTournee * 18;

document.getElementById("resultat").innerHTML = `

<div class="big">📊 TOTAL</div>
Volume : ${volume.toFixed(2)} m³<br>
Sacs : ${Math.ceil(sacsTotal)}<br>
Tournées : ${Math.ceil(tournees)}<br>

<div class="big">🔥 PAR TOURNÉE</div>
Ciment : ${sacsParTournee.toFixed(2)} sac<br>
Sable : ${sableSeaux.toFixed(0)} seaux<br>
Gravier : ${gravierSeaux.toFixed(0)} seaux<br>
Eau : ${eau.toFixed(0)} L<br>

`;
}
</script>

</body>
</html>
